upstream auth_app_cluster {
	#	ip_hash;
	#   server <Node1 IP>:3000;
	#   server <Node2 IP>:3000;
    keepalive 400;
}

server {
    listen 443 ssl;
    server_name <your domain>;
    # SSL Certificates
#    ssl_certificate /etc/nginx/ssl/<your domain>/fullchain.cer;
#    ssl_certificate_key /etc/nginx/ssl/<your domain>/<your domain>.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-CHACHA20-POLY1305';
    ssl_prefer_server_ciphers on;
    ssl_session_timeout 1d;

    location / {
        proxy_pass http://auth_app_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 'off' is safer if your app handles its own redirects
        proxy_redirect off;
    }
}
